<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手写送货单电子化工具</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (用于生成标准 Excel xlsx 模板文件) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
            background-color: #f7f9fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        input:focus, button:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div id="app" class="w-full max-w-4xl bg-white shadow-2xl rounded-xl p-6 md:p-10 border border-gray-100">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-indigo-700 border-b-2 border-indigo-100 pb-3 mb-2">手写送货单电子化助手</h1>
            <p class="text-gray-600">拍摄送货单，自动识别校对，项目名称默认统一为“胶袋”，支持导出税务发票模板 (.xlsx)。</p>
        </header>

        <!-- API Key 设置区 -->
        <section id="apiKeySection" class="mb-8 p-6 bg-yellow-50 border border-yellow-300 rounded-lg shadow-inner hidden">
            <h2 class="text-xl font-semibold text-yellow-800 mb-4">🔑 设置 API 密钥</h2>
            <p class="text-sm text-yellow-700 mb-4">为了保护您的账户安全，密钥将存储在您的本地浏览器中，不会上传到服务器。</p>
            <div class="flex flex-col gap-3">
                <input type="password" id="apiKeyInput" placeholder="请输入您的 Gemini API Key (AIzaSy...)" 
                    class="w-full p-3 border border-yellow-300 rounded-lg focus:ring-2 focus:ring-yellow-500 outline-none">
                <button id="saveKeyButton" class="w-full py-2 bg-yellow-600 text-white font-bold rounded-lg hover:bg-yellow-700 transition duration-150">
                    保存密钥并开始使用
                </button>
            </div>
        </section>

        <!-- 主要应用内容 -->
        <div id="mainContent" class="hidden">
            
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <label for="taxRateSelect" class="text-xs font-semibold text-gray-600">发票默认税率：</label>
                    <select id="taxRateSelect" class="text-xs border border-gray-300 rounded px-2 py-1 bg-white">
                        <option value="0.13">13% (0.13)</option>
                        <option value="0.03">3% (0.03)</option>
                        <option value="0.01">1% (0.01)</option>
                        <option value="0">免税/0% (0)</option>
                    </select>
                </div>
                <button id="resetKeyButton" class="text-xs text-gray-400 hover:text-indigo-600 underline transition duration-150">
                    重置/更换 API 密钥
                </button>
            </div>

            <!-- 步骤 1: 图片上传 -->
            <section class="mb-8 p-6 bg-indigo-50 border border-indigo-200 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold text-indigo-800 mb-4">第一步：上传手写送货单照片 (可多选)</h2>
                <div class="flex flex-col sm:flex-row gap-4">
                    <input type="file" id="imageInput" accept="image/*" multiple
                        class="flex-grow text-sm text-gray-700
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-full file:border-0
                        file:text-sm file:font-semibold
                        file:bg-indigo-200 file:text-indigo-800
                        hover:file:bg-indigo-300 transition duration-150"
                    />
                    <button id="clearImageButton"
                            class="px-4 py-2 bg-red-500 text-white font-medium rounded-lg text-sm hover:bg-red-600 transition duration-150 disabled:opacity-50"
                            disabled>
                        🗑️ 清除所有图片
                    </button>
                </div>
            </section>

            <!-- 步骤 2: 处理与指示 -->
            <section class="mb-8">
                <button id="processButton"
                        class="w-full py-3 bg-indigo-600 text-white font-bold rounded-lg shadow-lg hover:bg-indigo-700 transition duration-150 disabled:opacity-50"
                        disabled>
                    开始处理所有图片并转化
                </button>
                <div id="loadingIndicator" class="mt-4 p-3 text-center rounded-lg bg-indigo-50 border border-indigo-200 hidden">
                    <div class="animate-spin inline-block w-5 h-5 border-2 border-indigo-500 border-t-transparent rounded-full"></div>
                    <span id="loadingMessage" class="ml-3 text-indigo-600 font-medium">正在读取图片 1 / 0，请稍候...</span>
                </div>
                <div id="messageBox" class="mt-4 p-3 rounded-lg text-sm font-medium hidden"></div>
            </section>

            <!-- 步骤 3: 结果与导出 -->
            <section id="resultsSection" class="hidden">
                <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">📦 汇总识别结果表格 (已按单号排序)</h2>
                
                <div id="tableOutput" class="overflow-x-auto mb-4 border border-gray-200 rounded-lg shadow-md">
                    <!-- 表格内容 -->
                </div>

                <div class="flex flex-col sm:flex-row gap-3">
                    <button id="exportExcelButton"
                            class="flex-1 py-3 bg-green-600 text-white font-bold rounded-lg hover:bg-green-700 transition duration-150 shadow-md">
                        📊 导出税务发票模板 (发票开具项目信息导入.xlsx)
                    </button>
                    <button id="exportCsvButton"
                            class="py-3 px-6 bg-gray-600 text-white font-medium rounded-lg hover:bg-gray-700 transition duration-150">
                        ⬇️ 导出常规 CSV
                    </button>
                </div>
            </section>

            <!-- 步骤 4: 预览 -->
            <section id="previewSection" class="mt-8 border-t border-gray-200 pt-6 hidden">
                <h2 class="text-lg font-semibold text-gray-700 mb-2">首张图片预览</h2>
                <img id="imagePreview" class="max-w-full h-auto rounded-lg shadow-lg border border-gray-300" />
            </section>
        </div>
    </div>

    <script type="module">
        const MODEL_NAME = "gemini-1.5-flash";
        
        const appState = {
            apiKey: "",
            files: [],
            extractedItems: [],
            isProcessing: false,
        };

        const D = {
            app: document.getElementById('app'),
            apiKeySection: document.getElementById('apiKeySection'),
            apiKeyInput: document.getElementById('apiKeyInput'),
            saveKeyButton: document.getElementById('saveKeyButton'),
            resetKeyButton: document.getElementById('resetKeyButton'),
            mainContent: document.getElementById('mainContent'),
            taxRateSelect: document.getElementById('taxRateSelect'),
            
            imageInput: document.getElementById('imageInput'),
            clearImageButton: document.getElementById('clearImageButton'),
            processButton: document.getElementById('processButton'),
            loadingIndicator: document.getElementById('loadingIndicator'),
            loadingMessage: document.getElementById('loadingMessage'),
            tableOutput: document.getElementById('tableOutput'),
            exportExcelButton: document.getElementById('exportExcelButton'),
            exportCsvButton: document.getElementById('exportCsvButton'),
            messageBox: document.getElementById('messageBox'),
            resultsSection: document.getElementById('resultsSection'),
            imagePreview: document.getElementById('imagePreview'),
            previewSection: document.getElementById('previewSection'),
        };

        function initKeySystem() {
            const storedKey = localStorage.getItem('GEMINI_API_KEY');
            if (storedKey) {
                appState.apiKey = storedKey;
                showMainContent();
            } else {
                showKeySetup();
            }
        }

        function showKeySetup() {
            D.apiKeySection.classList.remove('hidden');
            D.mainContent.classList.add('hidden');
        }

        function showMainContent() {
            D.apiKeySection.classList.add('hidden');
            D.mainContent.classList.remove('hidden');
        }

        D.saveKeyButton.addEventListener('click', () => {
            const inputKey = D.apiKeyInput.value.trim();
            if (inputKey && inputKey.startsWith('AIza')) {
                localStorage.setItem('GEMINI_API_KEY', inputKey);
                appState.apiKey = inputKey;
                showMainContent();
                showMessage('密钥已保存到本地浏览器。', 'success');
            } else {
                alert('请输入有效的 Gemini API Key (通常以 AIza 开头)');
            }
        });

        D.resetKeyButton.addEventListener('click', () => {
            if(confirm('确定要清除本地保存的 API 密钥吗？清除后需要重新输入。')) {
                localStorage.removeItem('GEMINI_API_KEY');
                appState.apiKey = "";
                D.apiKeyInput.value = "";
                resetApp();
                showKeySetup();
            }
        });

        function showMessage(message, type = 'info') {
            D.messageBox.textContent = message;
            D.messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-blue-100', 'text-blue-700');

            if (type === 'error') {
                D.messageBox.classList.add('bg-red-100', 'text-red-700');
            } else if (type === 'success') {
                D.messageBox.classList.add('bg-green-100', 'text-green-700');
            } else {
                D.messageBox.classList.add('bg-blue-100', 'text-blue-700');
            }
            D.messageBox.classList.remove('hidden');
        }

        function resetApp() {
            appState.files = [];
            appState.extractedItems = [];
            appState.isProcessing = false;
            
            D.imageInput.value = '';
            D.processButton.disabled = true;
            D.clearImageButton.disabled = true;
            
            D.previewSection.classList.add('hidden');
            D.resultsSection.classList.add('hidden');
            D.loadingIndicator.classList.add('hidden');
            
            D.tableOutput.innerHTML = '';
            D.messageBox.classList.add('hidden');
            if(appState.apiKey) showMessage('请选择一张或多张送货单图片开始处理。', 'info');
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        function renderTable(items) {
            if (!items || items.length === 0) {
                D.tableOutput.innerHTML = '<p class="text-center text-gray-500 p-4">未提取到任何有效数据。</p>';
                return;
            }

            let html = `
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-indigo-100">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-indigo-700 uppercase tracking-wider">送货单号</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-indigo-700 uppercase tracking-wider">开票品名</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-indigo-700 uppercase tracking-wider">规格型号</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-indigo-700 uppercase tracking-wider">单位</th>
                            <th class="px-4 py-3 text-right text-xs font-semibold text-indigo-700 uppercase tracking-wider">数量</th>
                            <th class="px-4 py-3 text-right text-xs font-semibold text-indigo-700 uppercase tracking-wider">单价</th>
                            <th class="px-4 py-3 text-right text-xs font-semibold text-indigo-700 uppercase tracking-wider">金额</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
            `;

            items.forEach((item, index) => {
                const quantity = Number(item.quantity) || 0;
                const unitPrice = Number(item.unitPrice) || 0;
                const totalAmount = (quantity * unitPrice).toFixed(2);
                const priceDisplay = `¥${unitPrice.toFixed(2)}`;
                
                let priceClass = "text-gray-700";
                let rowClass = index % 2 === 0 ? 'bg-white' : 'bg-gray-50';
                
                if (item.isPriceCertain === false) {
                     priceClass = "text-red-700 font-bold bg-red-100 rounded px-1";
                }

                html += `
                    <tr class="${rowClass} hover:bg-indigo-50 transition duration-150">
                        <td class="px-4 py-2 whitespace-nowrap text-sm font-medium text-blue-600">${item.deliveryNo || '-'}</td>
                        <td class="px-4 py-2 whitespace-nowrap text-sm font-semibold text-gray-800">胶袋</td>
                        <td class="px-4 py-2 whitespace-nowrap text-sm font-medium text-gray-700">${item.nameAndSpec || '-'}</td>
                        <td class="px-4 py-2 whitespace-nowrap text-sm text-gray-600">${item.unit || '只'}</td>
                        <td class="px-4 py-2 whitespace-nowrap text-sm text-right text-gray-700">${quantity}</td>
                        <td class="px-4 py-2 whitespace-nowrap text-sm text-right ${priceClass}">${priceDisplay}</td>
                        <td class="px-4 py-2 whitespace-nowrap text-sm text-right text-indigo-600 font-semibold">¥${totalAmount}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            D.tableOutput.innerHTML = html;
        }

        // 导出符合税务模板的 Excel 文件 (.xlsx)
        function downloadTaxExcel() {
            const taxRate = D.taxRateSelect.value;
            const items = appState.extractedItems;
            if (!items || items.length === 0) return;

            // 构造税务模板的 sheet 数据
            const sheetData = [
                // 第 1 行：填表说明
                [
                    "填表说明：\n1、项目名称：无需写商品和服务税收分类简称（*号以及中间内容）。\n2、导入前请在电子税务局【开票业务】-【开票信息维护】中对开具的项目信息进行维护，或在导入模板中填写“商品与服务税收分类编码”。\n3、数量、单价可任填其中一项，或者仅填金额；如果三项均填写，导入后系统将默认以填写的数量*单价=金额进行误差校验；\n商品单价、商品数量：小数点后最多保留13位小数；\n金额：小数点后最多保留2位小数。"
                ],
                // 第 2 行：格式限制
                [
                    "必填\n(限100字符)",
                    "非必填\n(限19字符)",
                    "非必填\n(限40字符)",
                    "非必填\n(限20字符)",
                    "非必填\n(限16字符)",
                    "非必填\n(限16字符)\t",
                    "必填\n(限18字符)\n(保留两位小数)",
                    "必填\n(以小数后两位形式填写，如“0.13”代\n表税率13%)",
                    "非必填\n(限18字符)\n保留两位小数",
                    "非必填\n（限15字符)",
                    "非必填\n（限15字符)   "
                ],
                // 第 3 行：表头
                [
                    "项目名称",
                    "商品和服务税收分类编码",
                    "规格型号",
                    "单位",
                    "商品数量",
                    "商品单价",
                    "金额",
                    "税率",
                    "折扣金额",
                    "优惠政策类型",
                    "煤炭种类"
                ]
            ];

            // 填充识别到的明细数据（从第 4 行开始），项目名称统一为“胶袋”
            items.forEach(item => {
                const quantity = Number(item.quantity) || 0;
                const unitPrice = Number(item.unitPrice) || 0;
                const amount = Number((quantity * unitPrice).toFixed(2));
                const spec = item.nameAndSpec || ""; // 完整规格内容保留在规格型号列

                sheetData.push([
                    "胶袋",              // 1. 项目名称：统一默认改为“胶袋”
                    "",                  // 2. 商品和服务税收分类编码
                    spec,                // 3. 规格型号
                    item.unit || "只",   // 4. 单位
                    quantity,            // 5. 商品数量
                    unitPrice,           // 6. 商品单价
                    amount,              // 7. 金额
                    taxRate,             // 8. 税率
                    "",                  // 9. 折扣金额
                    taxRate === "0" ? "免税" : "", // 10. 优惠政策类型
                    ""                   // 11. 煤炭种类
                ]);
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(sheetData);
            
            // 设置主表名
            XLSX.utils.book_append_sheet(wb, ws, "1-明细模板");

            // 导出文件
            XLSX.writeFile(wb, "发票开具项目信息导入.xlsx");
            showMessage('发票导入模板 Excel 文件已生成并开始下载。', 'success');
        }

        // 常规 CSV 下载
        function downloadCSV() {
            const items = appState.extractedItems;
            const headers = ["送货单号", "项目名称", "规格型号", "单位", "数量", "单价", "金额"];
            let csv = headers.join(',') + '\n';

            items.forEach(item => {
                const qty = Number(item.quantity) || 0;
                const price = Number(item.unitPrice) || 0;
                const amt = (qty * price).toFixed(2);
                const row = [
                    `"${String(item.deliveryNo || '-').replace(/"/g, '""')}"`,
                    `"胶袋"`,
                    `"${String(item.nameAndSpec || '-').replace(/"/g, '""')}"`, 
                    String(item.unit || '只'),
                    String(qty),
                    String(price),
                    String(amt)
                ];
                csv += row.join(',') + '\n';
            });

            const bom = "\ufeff";
            const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', '送货单汇总数据.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showMessage('CSV 文件已生成并开始下载。', 'success');
        }

        async function callGeminiAPI(base64Data, mimeType, attempt = 1) {
            const MAX_RETRIES = 5;
            const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${appState.apiKey}`;

            const itemSchema = {
                type: "OBJECT",
                properties: {
                    "deliveryNo": { "type": "STRING", "description": "送货单号 (No)" },
                    "items": {
                        type: "ARRAY",
                        items: {
                            type: "OBJECT",
                            properties: {
                                "nameAndSpec": { "type": "STRING", "description": "名称及规格。包含材质/品名前缀与尺寸，如 'PPE 30*36+5' 或 '防水袋 30*40*50'。不要提取货号。" },
                                "unit": { "type": "STRING", "description": "单位，默认为'只'" },
                                "quantity": { "type": "NUMBER", "description": "数量" },
                                "unitPrice": { "type": "NUMBER", "description": "单价" },
                                "isPriceCertain": { "type": "BOOLEAN", "description": "单价是否有涂改、交叉线等不确定情况" }
                            },
                            required: ["nameAndSpec", "quantity", "unitPrice", "isPriceCertain"]
                        }
                    }
                },
                required: ["deliveryNo", "items"]
            };

            const systemPrompt = `你是一个专业的送货单数据提取助手。
            1. **目标**：提取"送货单号"以及列表中的“名称及规格”、“单位”、“数量”、“单价”。
            2. **规格格式**：
               - 数字*数字+数字+数字.数字 (如 26.5*37+5+2.5)
               - 数字*数字+数字 (如 30*40+5)
               - 数字*数字*数字 (如 30*40*50)
               - 数字*数字 (如 50*70)
               - 包含品名前缀（如 PPE、OPP、防水袋、FPP 双印、鸡内金等）。
            3. **排除干扰**：绝对不要提取“货号”栏的内容。只提取“名称及规格”栏下的手写字。
            4. **纯净输出**：将所有乘号 'X' 或 'x' 统一转为 '*'。`;
            
            const userQuery = "请提取图片中的送货单号和所有有效送货明细。";

            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: userQuery },
                            {
                                inlineData: {
                                    mimeType: mimeType,
                                    data: base64Data
                                }
                            }
                        ]
                    }
                ],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: itemSchema
                },
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            try {
                if (!appState.apiKey) throw new Error("请先设置 API Key。");
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error(`API Request Failed (Attempt ${attempt}): HTTP Status ${response.status}`, errorText);
                    throw new Error(`AI 请求失败 (状态码: ${response.status})。请检查 Key 或网络。`);
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const jsonString = candidate.content.parts[0].text;
                    const cleanedJsonString = jsonString.replace(/^```json\s*|```\s*$/g, '').trim();
                    const resultData = JSON.parse(cleanedJsonString);
                    const deliveryNo = resultData.deliveryNo || "";
                    const items = resultData.items || [];

                    return Array.isArray(items) 
                        ? items.map(item => ({ ...item, deliveryNo })).filter(item => item && item.nameAndSpec) 
                        : [];
                } else {
                    throw new Error("模型返回空内容。");
                }

            } catch (error) {
                if (attempt < MAX_RETRIES) {
                    const delay = Math.pow(2, attempt) * 1000 + Math.random() * 500;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return callGeminiAPI(base64Data, mimeType, attempt + 1);
                }
                throw error;
            }
        }

        async function handleProcessAll() {
            if (appState.isProcessing || appState.files.length === 0) return;

            appState.isProcessing = true;
            appState.extractedItems = [];
            D.processButton.disabled = true;
            D.clearImageButton.disabled = true;
            D.resultsSection.classList.add('hidden');
            D.tableOutput.innerHTML = '';
            D.loadingIndicator.classList.remove('hidden');
            D.messageBox.classList.add('hidden');
            
            const totalFiles = appState.files.length;

            for (let i = 0; i < totalFiles; i++) {
                const file = appState.files[i];
                const fileNumber = i + 1;
                
                D.loadingMessage.textContent = `正在处理图片 ${fileNumber} / ${totalFiles} (${file.name})...`;
                showMessage(`开始处理第 ${fileNumber} 张图片...`, 'info');

                try {
                    const base64Data = await fileToBase64(file);
                    const items = await callGeminiAPI(base64Data, file.type);

                    if (items && items.length > 0) {
                        items.forEach(item => {
                            if (item.nameAndSpec && item.nameAndSpec.includes('防水袋')) {
                                item.nameAndSpec = item.nameAndSpec.replace(/(\d{2})(\d{2})(\d{2})/g, (match, p1, p2, p3) => {
                                    return match.includes('*') ? match : `${p1}*${p2}*${p3}`;
                                });
                            }
                        });

                        appState.extractedItems.push(...items);
                        showMessage(`第 ${fileNumber} 张图片处理成功，提取到 ${items.length} 条数据。`, 'success');
                    } else {
                        showMessage(`第 ${fileNumber} 张图片未识别到有效条目。`, 'info');
                    }

                } catch (error) {
                    console.error(`处理图片 ${fileNumber} 出错:`, error);
                    showMessage(`第 ${fileNumber} 张图片失败: ${error.message}`, 'error');
                }
            }
            
            // 按送货单号升序排序
            appState.extractedItems.sort((a, b) => {
                const aNum = parseInt(a.deliveryNo) || 0;
                const bNum = parseInt(b.deliveryNo) || 0;
                return aNum - bNum;
            });

            D.loadingIndicator.classList.add('hidden');
            appState.isProcessing = false;
            D.processButton.disabled = false;
            D.clearImageButton.disabled = false;

            if (appState.extractedItems.length > 0) {
                renderTable(appState.extractedItems);
                D.resultsSection.classList.remove('hidden');
                showMessage(`所有图片处理完成！共汇总 ${appState.extractedItems.length} 条明细。`, 'success');
            } else {
                D.resultsSection.classList.add('hidden');
                showMessage(`处理完毕，未能提取到有效明细。`, 'info');
            }
        }

        D.imageInput.addEventListener('change', (event) => {
            appState.files = Array.from(event.target.files);
            D.messageBox.classList.add('hidden');
            
            if (appState.files.length > 0) {
                D.processButton.disabled = false;
                D.clearImageButton.disabled = false;
                
                const firstFile = appState.files[0];
                const reader = new FileReader();
                reader.onload = (e) => {
                    D.imagePreview.src = e.target.result;
                    D.previewSection.classList.remove('hidden');
                };
                reader.readAsDataURL(firstFile);
                
                showMessage(`已选择 ${appState.files.length} 张图片，请点击开始处理。`, 'info');
            } else {
                resetApp();
            }
        });

        D.clearImageButton.addEventListener('click', resetApp);
        D.processButton.addEventListener('click', handleProcessAll);
        D.exportExcelButton.addEventListener('click', downloadTaxExcel);
        D.exportCsvButton.addEventListener('click', downloadCSV);

        document.addEventListener('DOMContentLoaded', initKeySystem);
    </script>
</body>
</html>
